    .pill-tag { font-size: 10px; font-weight: 600; text-anchor: middle; }
    .conn-label { font-size: 10px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .flow-line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .dashed-green { stroke: #16a34a; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
