name: vetra-platform

services:
  # ─── 1. PostgreSQL 17 + PostGIS Container ───────────────────────────
  postgres:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/amd64
    container_name: vetra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vetra_db}
      POSTGRES_USER: ${DB_USER:-vetra_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vetra_password_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vetra_user} -d ${DB_NAME:-vetra_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vetra-network

  # ─── 2. Redis 7 High-Performance Cache Container ────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: vetra-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-vetra_redis_password_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-vetra_redis_password_secret} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - vetra-network

  # ─── 3. Vetra Backend Core Service ──────────────────────────────────
  vetra-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetra-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-vetra_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-vetra_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-vetra_password_secret}
      REDIS_HOST: ${REDIS_HOST_NAME:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-vetra_redis_password_secret}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2000ms}
      VETRA_REDIS_HOST: ${REDIS_HOST_NAME:-redis}
      VETRA_REDIS_PORT: ${REDIS_PORT:-6379}
      VETRA_REDIS_PASSWORD: ${REDIS_PASSWORD:-vetra_redis_password_secret}
      VETRA_REDIS_DATABASE: ${REDIS_DATABASE:-0}
      VETRA_REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2000ms}
      VETRA_JWT_SECRET: ${JWT_SECRET:-replace_with_a_secure_256_bit_random_secret_string}
      VETRA_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      VETRA_JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      VETRA_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      VETRA_AWS_REGION: ${AWS_REGION:-ap-south-1}
      VETRA_AWS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-}
      VETRA_AWS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      VETRA_AWS_S3_BUCKET: ${AWS_S3_BUCKET:-vetra-media-storage}
      VETRA_AI_ENABLED: ${AI_ENABLED:-false}
      VETRA_AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-NONE}
      VETRA_AI_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 35s
    networks:
      - vetra-network

networks:
  vetra-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
