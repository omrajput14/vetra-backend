# Grafana Datasource Provisioning — Vetra Platform (Stage 12.4.2)
# Auto-provisions the Prometheus datasource. No manual configuration required.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: vetra-prometheus
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: "5s"
      queryTimeout: "30s"
    editable: false
