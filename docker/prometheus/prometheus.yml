# Prometheus Configuration for Vetra Platform Monitoring (Stage 12.5.0)
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s
  external_labels:
    environment: 'production-docker'
    service: 'vetra-platform'

# Enable exemplar storage so Prometheus can store trace ID exemplars.
# This powers the Prometheus metric → Tempo trace click-through in Grafana.
feature_flags:
  - exemplar-storage


rule_files:
  - '/etc/prometheus/rules/*.yml'

alerting:
  alertmanagers:
    - scheme: http
      timeout: 5s
      static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'vetra-backend'
    metrics_path: '/actuator/prometheus'
    scheme: 'http'
    static_configs:
      - targets: ['vetra-backend:8080']
        labels:
          application: 'vetra-backend'
          group: 'backend-microservice'

  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis-exporter'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          application: 'vetra-redis'
          group: 'infrastructure'

