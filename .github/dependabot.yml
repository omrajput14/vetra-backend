version: 2
updates:
  # ─── 1. Maven Java Dependencies ─────────────────────────────────────
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
      - "maven"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # Ignore breaking major Spring Boot releases beyond 3.x
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      # Ignore breaking major SpringDoc OpenAPI releases beyond 2.x
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]

  # ─── 2. GitHub Actions Workflows ────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
