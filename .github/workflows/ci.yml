name: Enterprise Continuous Integration

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

# Concurrency management: cancel outdated in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── 1. Quality, Compile, Checkstyle & Test Execution ───────────────
  build-and-test:
    name: Build, Checkstyle & Test Suite Execution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      checks: write

    services:
      redis:
        image: redis:7-alpine
        command: redis-server --requirepass test_password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a test_password ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Execute Checkstyle, Compile & Maven Test Suite
        run: ./mvnw clean verify -B
        env:
          REDIS_PASSWORD: test_password

      - name: Generate Test Summary
        if: always()
        run: |
          echo "### 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "Build status: SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "Java Version: 21 (Eclipse Temurin)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Executable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetra-backend-jar
          path: target/vetra-backend-*.jar
          retention-days: 30

      - name: Upload Checkstyle & Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-and-checkstyle-reports
          path: |
            target/checkstyle-result.xml
            target/surefire-reports/
          retention-days: 30

  # ─── 2. Dockerfile & Docker Compose Validation ──────────────────────
  docker-validation:
    name: Validate Production Docker & Compose Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Production Dockerfile Build with Layer Caching
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Manifest
        run: |
          cp .env.example .env
          docker compose config --quiet

  # ─── 3. Secret Leak Scanning (Gitleaks) ─────────────────────────────
  secret-scan:
    name: Gitleaks Secret & API Key Exposure Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
