name: Enterprise Continuous Integration

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

# Concurrency management: cancel outdated in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── 1. Quality, Compile, Checkstyle & Test Execution ───────────────
  build-and-test:
    name: Build, Checkstyle & Test Suite Execution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      checks: write

    services:
      redis:
        image: redis:7-alpine
        command: redis-server --requirepass test_password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a test_password ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Resolve Maven Dependencies (with retry on 429)
        # Pre-resolves all dependencies into the local repository cache before
        # running the full verify. This isolates dependency resolution failures
        # (HTTP 429 transient) from build failures, and limits retry scope.
        # --fail-at-end ensures all resolution is attempted before failing.
        run: |
          for attempt in 1 2 3; do
            echo "Dependency resolution attempt $attempt of 3..."
            ./mvnw dependency:go-offline -B \
              --settings .mvn/settings.xml \
              -Dhttp.keepAlive=false \
              && echo "Dependencies resolved successfully on attempt $attempt" \
              && break
            if [ $attempt -eq 3 ]; then
              echo "Dependency resolution failed after 3 attempts — Maven Central unavailable"
              exit 1
            fi
            echo "Attempt $attempt failed (possible HTTP 429). Waiting 30 seconds before retry..."
            sleep 30
          done
        env:
          MAVEN_OPTS: >-
            -Dmaven.wagon.http.retryHandler.count=3
            -Dmaven.wagon.http.connectionTimeout=20000
            -Dmaven.wagon.http.readTimeout=60000
            -Dhttp.keepAlive=false

      - name: Execute Checkstyle, Compile & Maven Test Suite
        run: ./mvnw clean verify -B --settings .mvn/settings.xml
        env:
          REDIS_PASSWORD: test_password
          MAVEN_OPTS: >-
            -Dmaven.wagon.http.retryHandler.count=3
            -Dmaven.wagon.http.connectionTimeout=20000
            -Dmaven.wagon.http.readTimeout=60000

      - name: Generate Test Summary
        if: always()
        run: |
          echo "### 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "Build status: SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "Java Version: 21 (Eclipse Temurin)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Executable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetra-backend-jar
          path: target/vetra-backend-*.jar
          retention-days: 30

      - name: Upload Checkstyle & Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-and-checkstyle-reports
          path: |
            target/checkstyle-result.xml
            target/surefire-reports/
          retention-days: 30

  # ─── 2. Dockerfile Build & ECR Publish ────────────────────────────────
  docker-build-publish:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write # Required for AWS OIDC authentication

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vetra-github-actions-deploy
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Publish Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ github.ref == 'refs/heads/main' && format('{0}/vetra-backend-staging:{1}', steps.login-ecr.outputs.registry, github.sha) || 'vetra-backend:local' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Manifest
        run: |
          cp .env.example .env
          docker compose config --quiet

  # ─── 3. Secret Leak Scanning (Gitleaks) ─────────────────────────────
  secret-scan:
    name: Gitleaks Secret & API Key Exposure Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
