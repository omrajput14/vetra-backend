name: Enterprise Continuous Integration & Deployment

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

# Concurrency management: cancel outdated PR builds, but queue staging deployments sequentially
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ─── 1. Quality, Compile, Checkstyle & Test Execution ───────────────
  build-and-test:
    name: Build, Checkstyle & Test Suite Execution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      checks: write

    services:
      redis:
        image: redis:7-alpine
        command: redis-server --requirepass test_password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a test_password ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Resolve Maven Dependencies (with retry on 429)
        run: |
          for attempt in 1 2 3; do
            echo "Dependency resolution attempt $attempt of 3..."
            ./mvnw dependency:go-offline -B \
              --settings .mvn/settings.xml \
              -Dhttp.keepAlive=false \
              && echo "Dependencies resolved successfully on attempt $attempt" \
              && break
            if [ $attempt -eq 3 ]; then
              echo "Dependency resolution failed after 3 attempts — Maven Central unavailable"
              exit 1
            fi
            echo "Attempt $attempt failed (possible HTTP 429). Waiting 30 seconds before retry..."
            sleep 30
          done
        env:
          MAVEN_OPTS: >-
            -Dmaven.wagon.http.retryHandler.count=3
            -Dmaven.wagon.http.connectionTimeout=20000
            -Dmaven.wagon.http.readTimeout=60000
            -Dhttp.keepAlive=false

      - name: Execute Checkstyle, Compile & Maven Test Suite
        run: ./mvnw clean verify -B --settings .mvn/settings.xml
        env:
          REDIS_PASSWORD: test_password
          MAVEN_OPTS: >-
            -Dmaven.wagon.http.retryHandler.count=3
            -Dmaven.wagon.http.connectionTimeout=20000
            -Dmaven.wagon.http.readTimeout=60000

      - name: Generate Test Summary
        if: always()
        run: |
          echo "### 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "Build status: SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "Java Version: 21 (Eclipse Temurin)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Executable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetra-backend-jar
          path: target/vetra-backend-*.jar
          retention-days: 30

      - name: Upload Checkstyle & Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-and-checkstyle-reports
          path: |
            target/checkstyle-result.xml
            target/surefire-reports/
          retention-days: 30

  # ─── 2. Secret Leak Scanning (Gitleaks) ─────────────────────────────
  secret-scan:
    name: Gitleaks Secret & API Key Exposure Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 3. Dockerfile Build & ECR Publish ────────────────────────────────
  docker-build-publish:
    name: Build & Publish Docker Image to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test, secret-scan]

    permissions:
      contents: read
      id-token: write # Required for AWS OIDC authentication

    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.image-metadata.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate AWS Account ID Variable
        if: github.ref == 'refs/heads/main'
        run: |
          ACCOUNT_ID="${{ vars.AWS_ACCOUNT_ID }}"
          if [[ -z "$ACCOUNT_ID" ]]; then
            echo "::error::GitHub Repository Variable 'AWS_ACCOUNT_ID' is missing or empty."
            echo "Please set 'AWS_ACCOUNT_ID' (12-digit AWS Account ID) in Repository Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          if [[ ! "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::GitHub Repository Variable 'AWS_ACCOUNT_ID' is invalid. It must be a 12-digit numeric AWS Account ID."
            echo "Please update 'AWS_ACCOUNT_ID' in Repository Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          echo "AWS_ACCOUNT_ID repository variable validated successfully."

      - name: Configure AWS Credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vetra-github-actions-deploy
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute Image Tag Metadata
        id: image-metadata
        run: |
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and Publish Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ github.ref == 'refs/heads/main' && format('{0}/vetra-backend-staging:{1}', steps.login-ecr.outputs.registry, github.sha) || 'vetra-backend:local' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Manifest
        run: |
          cp .env.example .env
          docker compose config --quiet

  # ─── 4. Automated ECS Fargate Staging Deployment ────────────────────
  deploy-staging:
    name: Deploy to ECS Fargate Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-build-publish]
    if: github.ref == 'refs/heads/main'

    concurrency:
      group: staging-ecs-deployment
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write # Required for AWS OIDC authentication

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vetra-github-actions-deploy
          aws-region: ap-south-1

      - name: Render and Register Updated ECS Task Definition
        id: register-task-def
        run: |
          IMAGE_URI="${{ needs.docker-build-publish.outputs.ecr_registry }}/vetra-backend-staging:${{ github.sha }}"
          echo "Target Image URI: $IMAGE_URI"

          echo "Downloading current task definition for family vetra-staging-backend..."
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition vetra-staging-backend --region ap-south-1 --query "taskDefinition")

          echo "Updating container image to $IMAGE_URI while preserving execution/task roles, secrets, and environment..."
          NEW_DEF_JSON=$(echo "$TASK_DEF_JSON" | jq --arg IMAGE "$IMAGE_URI" '
            .containerDefinitions[0].image = $IMAGE |
            {
              family: .family,
              taskRoleArn: .taskRoleArn,
              executionRoleArn: .executionRoleArn,
              networkMode: .networkMode,
              containerDefinitions: .containerDefinitions,
              volumes: .volumes,
              placementConstraints: .placementConstraints,
              requiresCompatibilities: .requiresCompatibilities,
              cpu: .cpu,
              memory: .memory
            } | del(.[] | nulls)')

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF_JSON" \
            --region ap-south-1 \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "Registered new ECS task definition: $NEW_TASK_DEF_ARN"
          echo "task_def_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Update ECS Service & Trigger Rolling Deployment
        run: |
          echo "Deploying task definition ${{ steps.register-task-def.outputs.task_def_arn }} to service vetra-staging-backend-service..."
          aws ecs update-service \
            --cluster vetra-staging-cluster \
            --service vetra-staging-backend-service \
            --task-definition "${{ steps.register-task-def.outputs.task_def_arn }}" \
            --region ap-south-1

      - name: Wait for ECS Service Stability
        run: |
          echo "Waiting for ECS service vetra-staging-backend-service to reach stable state..."
          aws ecs wait services-stable \
            --cluster vetra-staging-cluster \
            --service vetra-staging-backend-service \
            --region ap-south-1
          echo "ECS service reached stable state!"

      - name: Verify ALB Target Group Health
        run: |
          echo "Locating target group ARN for vetra-staging-backend-tg..."
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names vetra-staging-backend-tg \
            --region ap-south-1 \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text)
          echo "Target Group ARN: $TG_ARN"

          echo "Polling target health..."
          HEALTHY=false
          for attempt in {1..20}; do
            HEALTH_STATUS=$(aws elbv2 describe-target-health \
              --target-group-arn "$TG_ARN" \
              --region ap-south-1 \
              --query "TargetHealthDescriptions[?TargetHealth.State=='healthy'].TargetHealth.State" \
              --output text)
            if [[ "$HEALTH_STATUS" =~ "healthy" ]]; then
              echo "ALB Target Group is HEALTHY on attempt $attempt/20!"
              HEALTHY=true
              break
            fi
            echo "Target not yet healthy on attempt $attempt/20. Waiting 10s..."
            sleep 10
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "::error::ALB target group failed to report healthy state."
            aws elbv2 describe-target-health --target-group-arn "$TG_ARN" --region ap-south-1
            exit 1
          fi

      - name: Execute End-to-End Application Smoke Tests
        run: |
          ALB_URL="http://vetra-staging-alb-704759510.ap-south-1.elb.amazonaws.com"
          echo "Executing smoke tests against $ALB_URL..."

          echo "1. Probing /actuator/health/liveness (Liveness probe)..."
          LIVENESS_RESP=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL/actuator/health/liveness")
          if [ "$LIVENESS_RESP" != "200" ]; then
            echo "::error::/actuator/health/liveness failed with HTTP $LIVENESS_RESP"
            exit 1
          fi
          echo "   ✅ /actuator/health/liveness -> HTTP 200 OK"

          echo "2. Probing /actuator/health (Full health: DB + Redis TLS)..."
          HEALTH_RESP=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL/actuator/health")
          if [ "$HEALTH_RESP" != "200" ]; then
            echo "::error::/actuator/health failed with HTTP $HEALTH_RESP"
            exit 1
          fi
          echo "   ✅ /actuator/health -> HTTP 200 OK"

          echo "3. Probing /liveness (Application probe)..."
          APP_LIVENESS_RESP=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL/liveness")
          if [ "$APP_LIVENESS_RESP" != "200" ]; then
            echo "::error::/liveness failed with HTTP $APP_LIVENESS_RESP"
            exit 1
          fi
          echo "   ✅ /liveness -> HTTP 200 OK"

          echo "4. Probing /readiness (Application readiness)..."
          APP_READINESS_RESP=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL/readiness")
          if [ "$APP_READINESS_RESP" != "200" ]; then
            echo "::error::/readiness failed with HTTP $APP_READINESS_RESP"
            exit 1
          fi
          echo "   ✅ /readiness -> HTTP 200 OK"

          echo "All application smoke tests PASSED successfully!"

      - name: Verify Deployment Immutability
        run: |
          echo "Verifying running task image matches Git commit SHA ${{ github.sha }}..."
          DEPLOYED_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "${{ steps.register-task-def.outputs.task_def_arn }}" \
            --region ap-south-1 \
            --query "taskDefinition.containerDefinitions[0].image" \
            --output text)
          echo "Task Definition image: $DEPLOYED_IMAGE"

          if [[ ! "$DEPLOYED_IMAGE" =~ "${{ github.sha }}" ]]; then
            echo "::error::Deployed task definition image does not contain Git commit SHA ${{ github.sha }}"
            exit 1
          fi
          echo "Verified: Deployed container image is immutable and matches Git SHA ${{ github.sha }}."

      - name: Publish Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR Image Tag:** \`vetra-backend-staging:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECS Task Definition:** \`${{ steps.register-task-def.outputs.task_def_arn }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECS Service:** \`vetra-staging-backend-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ALB Target Health:** 🟢 HEALTHY" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Tests:** 🟢 4/4 PASSED (HTTP 200)" >> $GITHUB_STEP_SUMMARY
