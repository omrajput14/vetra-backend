name: Enterprise Continuous Integration & Deployment

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

# Concurrency management: cancel outdated PR builds, but queue staging deployments sequentially
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ─── 1. Quality, Compile, Checkstyle & Test Execution ───────────────
  build-and-test:
    name: Build, Checkstyle & Test Suite Execution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      checks: write

    services:
      redis:
        image: redis:7-alpine
        command: redis-server --requirepass test_password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a test_password ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Resolve Maven Dependencies (with retry on 429)
        run: |
          for attempt in 1 2 3; do
            echo "Dependency resolution attempt $attempt of 3..."
            ./mvnw dependency:go-offline -B \
              --settings .mvn/settings.xml \
              -Dhttp.keepAlive=false \
              && echo "Dependencies resolved successfully on attempt $attempt" \
              && break
            if [ $attempt -eq 3 ]; then
              echo "Dependency resolution failed after 3 attempts — Maven Central unavailable"
              exit 1
            fi
            echo "Attempt $attempt failed (possible HTTP 429). Waiting 30 seconds before retry..."
            sleep 30
          done
        env:
          MAVEN_OPTS: >-
            -Dmaven.wagon.http.retryHandler.count=3
            -Dmaven.wagon.http.connectionTimeout=20000
            -Dmaven.wagon.http.readTimeout=60000
            -Dhttp.keepAlive=false

      - name: Execute Checkstyle, Compile & Maven Test Suite
        run: ./mvnw clean verify -B --settings .mvn/settings.xml
        env:
          REDIS_PASSWORD: test_password
          MAVEN_OPTS: >-
            -Dmaven.wagon.http.retryHandler.count=3
            -Dmaven.wagon.http.connectionTimeout=20000
            -Dmaven.wagon.http.readTimeout=60000

      - name: Generate Test Summary
        if: always()
        run: |
          echo "### 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "Build status: SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "Java Version: 21 (Eclipse Temurin)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Executable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetra-backend-jar
          path: target/vetra-backend-*.jar
          retention-days: 30

      - name: Upload Checkstyle & Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-and-checkstyle-reports
          path: |
            target/checkstyle-result.xml
            target/surefire-reports/
          retention-days: 30

  # ─── 2. Secret Leak Scanning (Gitleaks) ─────────────────────────────
  secret-scan:
    name: Gitleaks Secret & API Key Exposure Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Execute Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 3. Dockerfile Build & Compose Validation ────────────────────────
  docker-build-validate:
    name: Build Docker Image & Validate Compose Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test, secret-scan]

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: vetra-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Manifest
        run: |
          cp .env.example .env
          docker compose config --quiet
