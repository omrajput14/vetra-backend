name: Feature Request
description: Propose a new feature, module enhancement, or architectural improvement
title: "feat: [Short description]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to suggest architectural or module features for Vetra Backend.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or architectural gap?
      placeholder: Describe the motivation...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features considered.
